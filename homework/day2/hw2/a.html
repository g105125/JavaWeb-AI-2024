<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业2</title>
    <style>
      table {
        width: 80%;
        border-collapse: collapse;
        margin: 0 auto;
      }
      th,td {
        border: 1px solid #000;
        padding: 10px 0px;
      }
  </style>
</head>
<body>
    
    <!-- 需求: Vue挂载完成后, 通过axios发送异步请求到服务端, 或者学生列表数据, 并通过Vue展示在页面上. -->
    <div id="app">   
        <table>
            <thead>
            <tr>
                <th>编号</th>
                <th>姓名</th>
                <th>图像</th>
                <th>年龄</th>
                <th>性别</th>
                <th>成绩</th>
                <th>等级</th>
            </tr>
            </thead>
            <tbody>
            <tr align="center" v-for="item in students" :key="item.id">
                <td>{{item.id}}</td>
                <td>{{item.name}}</td>
                <td><img :src="item.image"></td>
                <td>{{item.age}}</td>
                <td>
                    <span v-if="item.gender==1">男</span>
                    <span v-if="item.gender==2">女</span>
                </td>
                <td>{{item.score}}</td>
                <td>
                    <span style="color: green;" v-if="item.score>=85">优秀</span>
                    <span style="color: yellow;" v-else-if="item.score>=60">及格</span>
                    <span style="color: red;" v-else>不及格</span>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
    
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module">
      import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
      
      createApp({
        data() {
          return {
            students:[] 
          }
        },
        methods:{
            async loadData(){
                let res=await axios.get("https://mock.apifox.cn/m1/3128855-0-default/student");
                this.students=res.data.data;
            }
        },
        mounted(){
            this.loadData();
        }
      }).mount('#app');
    </script>
</body>
</html>
