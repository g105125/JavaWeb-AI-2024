<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/a.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="app">
    <table>
        <thead>
            <tr>
                <th>编号</th>

                <th>歌手</th>
                <th>时长</th>
                <th>播放</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(item,index) in emplist" :key="item.id">

                <td>{{item.title}}</td>

                <td>{{item.time}}</td>
                <td><audio :src="'audios/'+item.title+'.mp3'" controls></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
